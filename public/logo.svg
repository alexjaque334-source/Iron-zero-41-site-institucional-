<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" fill="none">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c8ff00" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddff33"/>
      <stop offset="100%" stop-color="#b6f000"/>
    </linearGradient>
  </defs>
  
  <!-- Shield Badge Emblem -->
  <g transform="translate(10, 5) scale(0.9)">
    <!-- Shield contour -->
    <path d="M 65 5 L 115 18 L 105 85 L 65 125 L 25 85 L 15 18 Z" 
          stroke="#c8ff00" stroke-width="8" stroke-linejoin="round" fill="#0d0e12" filter="url(#neonGlow)"/>
    <!-- Inner dynamic IR monogram -->
    <path d="M 46 36 L 60 36 L 47 92 L 33 92 Z" fill="#c8ff00"/>
    <path d="M 61 36 L 85 36 C 96 36 102 42 99 54 C 97 64 90 70 79 70 L 67 70 L 62 92 L 49 92 L 57 56 L 75 56 C 81 56 84 53 85 48 C 86 43 82 42 77 42 L 59 42 Z" fill="#c8ff00"/>
    <path d="M 76 68 L 94 92 L 80 92 L 67 72 Z" fill="#c8ff00"/>
  </g>

  <!-- Typography Brand Text -->
  <g transform="translate(135, 20)">
    <!-- IRON in clean bold white -->
    <text x="0" y="58" font-family="'Montserrat', 'Inter', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">IRON</text>
    <!-- ZERO in electric neon green -->
    <text x="145" y="58" font-family="'Montserrat', 'Inter', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#c8ff00" letter-spacing="2">ZERO</text>
    <!-- 41 highlighted -->
    <text x="300" y="58" font-family="'Montserrat', 'Inter', 'Impact', sans-serif" font-weight="900" font-size="52" fill="#c8ff00" letter-spacing="2">41</text>
    
    <!-- Tagline -->
    <text x="2" y="86" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#94a3b8" letter-spacing="6">EXPERIÊNCIA &amp; PERFORMANCE</text>
  </g>
</svg>
